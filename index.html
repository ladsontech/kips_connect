<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#67c70f" />
    <meta
      name="description"
      content="Kibs Systems site survey and maintenance reporting app for technicians and admins."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/kibs-logo-mobile.png" />
    <link rel="apple-touch-icon" href="/kibs-logo-mobile.png" />
    <title>Kibs Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__kibsInstallPromptEvent = event;
        window.dispatchEvent(new Event('kibs-install-ready'));
      });

      window.addEventListener('appinstalled', function () {
        window.__kibsAppInstalled = true;
        window.__kibsInstallPromptEvent = null;
        window.dispatchEvent(new Event('kibs-app-installed'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
