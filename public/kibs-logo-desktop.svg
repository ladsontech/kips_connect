<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" className="w-full h-full" fill="none">
  <!-- Outer Wrapper & Green Pill Frame -->
  <g transform="translate(6, 4)">
    <!-- Pill background and border extending to right -->
    <rect 
      x="55" 
      y="12" 
      width="440" 
      height="46" 
      rx="23" 
      fill="#ffffff" 
      stroke="#16a34a" 
      stroke-width="3.5"
    />
    
    <!-- Red Company Name inside Pill -->
    <text 
      x="275" 
      y="44" 
      fill="#dc2626" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="27" 
      letter-spacing="0.08em"
      text-anchor="middle"
    >
      KIBS SYSTEMS LTD
    </text>

    <!-- Tagline underneath the pill -->
    <text 
      x="275" 
      y="76" 
      fill="#1e293b" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="600" 
      font-size="13" 
      letter-spacing="0.01em"
      text-anchor="middle"
    >
      Integrating Technology to your security needs
    </text>

    <!-- Circular Badge on the Left -->
    <g transform="translate(4, 2)">
      <!-- Outer circle shadow & green fill -->
      <circle cx="38" cy="38" r="38" fill="#15803d" />
      <circle cx="38" cy="38" r="35.5" fill="#16a34a" />
      <circle cx="38" cy="38" r="35.5" stroke="#14532d" stroke-width="2" />
      
      <!-- Stylized Black K Lettermark -->
      <!-- Vertical Stem & Brush Stroke -->
      <path 
        d="M20 16 C22 28, 22 46, 17 62 C16 65, 17 68, 21 66 C26 63, 29 48, 30 38 C32 30, 31 22, 28 17 C26 13, 20 13, 20 16 Z" 
        fill="#09090b" 
      />
      <!-- Upper diagonal arm of K -->
      <path 
        d="M28 35 C33 30, 42 22, 53 17 C57 15, 60 18, 56 22 C48 28, 39 36, 31 43 Z" 
        fill="#09090b" 
      />
      <!-- Lower diagonal leg of K -->
      <path 
        d="M26 39 C34 45, 45 55, 52 64 C55 68, 51 70, 47 67 C41 61, 32 50, 24 43 Z" 
        fill="#09090b" 
      />

      <!-- Superimposed S (white serif/bold) -->
      <text 
        x="39" 
        y="42" 
        fill="#ffffff" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-weight="900" 
        font-size="21" 
        text-anchor="middle"
        style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));"
      >
        S
      </text>

      <!-- Superimposed L (white serif/bold) below S -->
      <text 
        x="42" 
        y="58" 
        fill="#ffffff" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-weight="900" 
        font-size="17" 
        text-anchor="middle"
        style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));"
      >
        L
      </text>
    </g>
  </g>
</svg>
